<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Run detail -- Multi-Agent GraphRAG results</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<main>
  <p class="back-link">
    <a href="index.html">&larr; back to overview</a>
    &middot;
    <a href="https://github.com/PaoloAlbano/multi-agent-graphrag-implementation">&lt;/&gt; View code on GitHub</a>
  </p>
  <h1 id="title">Loading...</h1>
  <p class="subtitle" id="subtitle"></p>

  <div class="card">
    <dl id="manifest"></dl>
  </div>

  <div class="controls">
    <label><input type="checkbox" id="wrong-only" /> Wrong only</label>
    <span class="note" id="count"></span>
  </div>

  <table id="questions">
    <thead>
      <tr><th>Question</th><th>Result</th><th>Similarity</th><th>Iterations</th><th>Query calls</th><th></th></tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
</main>
<script type="module">
import { fetchJSON, fetchJSONL, escapeHtml, formatPct, badge, qs } from "./app.js";

const path = qs("path");
if (!path) {
  document.getElementById("title").textContent = "Missing ?path= parameter";
  throw new Error("no path");
}

const base = `results/${path}/`;

function renderManifest(manifest, entry) {
  const fields = [
    ["Model", manifest.model],
    ["Temperature", manifest.temperature],
    ["Reasoning", manifest.reasoning_enabled === false ? "off"
      : manifest.reasoning_effort ? `on (${manifest.reasoning_effort})`
      : manifest.reasoning_enabled === null ? "not tracked (legacy run)" : "on"],
    ["Split", manifest.split],
    ["Graph variant", manifest.graph_variant],
    ["Questions", entry ? `${entry.total}` : (manifest.limit ?? "not recorded")],
    ["Concurrency", manifest.concurrency ?? "not recorded"],
  ];
  const isExternal = window.location.hash === "#external";
  const ext = manifest.external_judge;
  // Determine which judge is displayed. In the default view we show the judge
  // that produced the primary score ("self-judge" for self-judged runs, the
  // fixed judge for fixed runs). In the #external view we always show the
  // fixed (external) judge. The score and judge-calls link always match the
  // displayed judge.
  let judgeWord = null, judgeName = null, judgeScore = null, judgeCallsLog = null;
  if (isExternal && ext) {
    judgeWord = "fixed judge";
    judgeName = ext.model || "fixed judge";
    judgeScore = ext;
    judgeCallsLog = ext.calls_log;
  } else if (manifest.judge_mode === "fixed") {
    judgeWord = "fixed judge";
    judgeName = (ext && ext.model) || "fixed judge";
    judgeScore = ext || null;
    judgeCallsLog = ext && ext.calls_log;
  } else if (manifest.judge_mode === "self") {
    judgeWord = "self-judge";
    judgeName = manifest.model;
    judgeScore = entry && entry.total != null
      ? { accuracy: entry.accuracy, correct: entry.correct, total: entry.total }
      : null;
    judgeCallsLog = manifest.judge_calls_log;
  }
  if (judgeWord) {
    const parts = [`<strong>${judgeWord}</strong> (${escapeHtml(judgeName)})`];
    if (judgeScore && judgeScore.total != null) {
      parts.push(`${formatPct(judgeScore.accuracy)} (${judgeScore.correct}/${judgeScore.total})`);
    }
    if (judgeCallsLog) {
      parts.push(`<a href="${base + judgeCallsLog}">judge calls log</a>`);
    }
    fields.push(["Judge", parts.join(" &middot; "), true]);
  }
  if (manifest.limit != null) {
    fields.push(["Limit", manifest.limit]);
  }
  document.getElementById("manifest").innerHTML = fields
    .map(([k, v, html]) =>
      `<dt${isExternal && k === "Judge" ? ' id="external"' : ""}>${escapeHtml(k)}</dt><dd>${html ? v : escapeHtml(v)}</dd>`)
    .join("");

  if (manifest.migrated) {
    document.getElementById("manifest").innerHTML += `
      <dt>Note</dt><dd class="note">${escapeHtml(manifest.migration_note || "Migrated legacy run.")}</dd>`;
  }
}

function questionRowHtml(item, index, callBreakdown) {
  const q = escapeHtml(item.question);
  const breakdown = callBreakdown ? callBreakdown.get(item.qid) : null;
  const qgCount = breakdown ? (breakdown.query_generator || 0) : 0;
  // Number of query-generation calls. In single mode this is always 1 (retry
  // attempts and errors are not counted); in agentic mode it reflects the
  // refinement iterations.
  let callsCell = "-";
  if (item.mode === "single") {
    if ((item.iterations ?? 0) > 0) {
      const title = qgCount > 1 ? `1 query generated (${qgCount} attempts)` : "1 query generated";
      callsCell = `<span class="calls" title="${escapeHtml(title)}">1</span>`;
    }
  } else if (qgCount > 0) {
    const title = qgCount === 1 ? "1 query generated" : `${qgCount} queries generated`;
    callsCell = `<span class="calls" title="${escapeHtml(title)}">${qgCount}</span>`;
  }
  return `
    <tr class="q-row" data-index="${index}" data-correct="${item.correct}">
      <td>${q}</td>
      <td>${badge(item.correct)}</td>
      <td>${item.similarity != null ? item.similarity.toFixed(2) : "-"}</td>
      <td>${item.iterations ?? "-"}</td>
      <td>${callsCell}</td>
      <td><button class="toggle-btn" data-index="${index}">details</button></td>
    </tr>
    <tr class="detail-row" id="detail-${index}">
      <td colspan="6"></td>
    </tr>
  `;
}

function agentBreakdownHtml(qid, callsByQid) {
  if (!callsByQid) return "";
  const calls = callsByQid.get(qid);
  if (!calls || !calls.length) return "";
  const byAgent = new Map();
  for (const c of calls) byAgent.set(c.agent, (byAgent.get(c.agent) || 0) + 1);
  const parts = [...byAgent.entries()].map(([agent, n]) => `${escapeHtml(agent)}: ${n}`);
  return `<p><strong>LLM calls for this question (${calls.length} total):</strong> ${parts.join(", ")}</p>`;
}

function detailHtml(item, callsByQid) {
  const errorBlock = item.error
    ? `<p><strong>Error:</strong> ${escapeHtml(item.error)}</p>`
    : "";
  return `
    <p><strong>qid:</strong> <code>${escapeHtml(item.qid)}</code></p>
    <p><strong>Gold Cypher</strong></p>
    <pre>${escapeHtml(item.gold_cypher)}</pre>
    <p><strong>Generated Cypher</strong></p>
    <pre>${escapeHtml(item.generated_cypher || "(none)")}</pre>
    <p><strong>Answer</strong></p>
    <pre>${escapeHtml(item.answer || "(none)")}</pre>
    ${errorBlock}
    ${agentBreakdownHtml(item.qid, callsByQid)}
    <button class="toggle-btn" data-calls-for="${escapeHtml(item.qid)}">show LLM calls</button>
    <div class="calls-container" data-calls-container-for="${escapeHtml(item.qid)}"></div>
  `;
}

function renderCallsFromCache(qid, container, manifest, allCalls) {
  if (container.dataset.loaded) return;
  container.dataset.loaded = "1";
  if (!manifest.calls_log_scoped) {
    const note = manifest.calls_log_note || "This run's call log cannot be attributed to individual questions.";
    const link = base + manifest.calls_log;
    container.innerHTML = `<p class="note">${escapeHtml(note)} <a href="${link}">Open the raw combined transcript</a> (${allCalls.length} calls, all questions/domains in this legacy run).</p>`;
    return;
  }
  const matching = allCalls.filter((c) => c.qid === qid);
  if (!matching.length) {
    container.innerHTML = '<p class="note">No matching calls found.</p>';
    return;
  }
  container.innerHTML = matching
    .map(
      (c) => `
      <div class="call">
        <div class="call-meta">${escapeHtml(c.agent)} &middot; ${escapeHtml(c.model)}${c.error ? " &middot; <strong>error</strong>" : ""}</div>
        <p><strong>System prompt</strong></p><pre>${escapeHtml(c.system_prompt)}</pre>
        <p><strong>User prompt</strong></p><pre>${escapeHtml(c.user_prompt)}</pre>
        <p><strong>${c.error ? "Error" : "Response"}</strong></p><pre>${escapeHtml(c.error || c.response)}</pre>
      </div>`
    )
    .join("");
}

async function main() {
  const [manifest, items] = await Promise.all([
    fetchJSON(base + "run.json"),
    fetchJSONL(base + "trace.jsonl"),
  ]);

  const entry = manifest.results[0] || {};
  document.getElementById("title").textContent = `${entry.domain || ""} / ${entry.mode || ""}`;
  document.getElementById("subtitle").textContent = `${manifest.model} -- ${formatPct(entry.accuracy)} accuracy (${entry.correct}/${entry.total})`;
  renderManifest(manifest, entry);

  // Fetch the call log once up front (not lazily per-question) so every row
  // can show its LLM call count, not just the one a user happens to expand.
  let allCalls = null;
  let callBreakdown = null;
  let callsByQid = null;
  if (manifest.calls_log) {
    try {
      allCalls = await fetchJSONL(base + manifest.calls_log);
      if (manifest.calls_log_scoped) {
        callBreakdown = new Map();
        callsByQid = new Map();
        for (const c of allCalls) {
          if (!callBreakdown.has(c.qid)) callBreakdown.set(c.qid, {});
          const bd = callBreakdown.get(c.qid);
          bd[c.agent] = (bd[c.agent] || 0) + 1;
          if (!callsByQid.has(c.qid)) callsByQid.set(c.qid, []);
          callsByQid.get(c.qid).push(c);
        }
      }
    } catch (err) {
      console.error("Failed to load call log:", err);
    }
  }

  const rowsEl = document.getElementById("rows");
  const wrongOnly = document.getElementById("wrong-only");
  const countEl = document.getElementById("count");

  function render() {
    const filtered = wrongOnly.checked ? items.filter((i) => !i.correct) : items;
    countEl.textContent = `${filtered.length} of ${items.length} questions`;
    rowsEl.innerHTML = filtered.map((item, i) => questionRowHtml(item, i, callBreakdown)).join("");

    rowsEl.querySelectorAll("button[data-index]").forEach((btn) => {
      btn.addEventListener("click", () => {
        const idx = btn.dataset.index;
        const detailRow = document.getElementById(`detail-${idx}`);
        const isOpen = detailRow.classList.toggle("open");
        if (isOpen && !detailRow.dataset.rendered) {
          detailRow.dataset.rendered = "1";
          detailRow.querySelector("td").innerHTML = detailHtml(filtered[idx], callsByQid);
          const callsBtn = detailRow.querySelector("button[data-calls-for]");
          callsBtn.addEventListener("click", () => {
            const container = detailRow.querySelector("[data-calls-container-for]");
            if (allCalls) renderCallsFromCache(callsBtn.dataset.callsFor, container, manifest, allCalls);
            else container.innerHTML = '<p class="note">No call log recorded for this run.</p>';
          });
        }
      });
    });
  }

  wrongOnly.addEventListener("change", render);
  render();

  // Re-render the manifest when the user toggles between the default view and
  // the #external view via the browser's back/forward buttons (which only
  // change the hash without reloading the page).
  window.addEventListener("hashchange", () => {
    const entry = manifest.results[0] || {};
    renderManifest(manifest, entry);
  });
}

main().catch((err) => {
  document.getElementById("title").textContent = "Failed to load run";
  document.getElementById("subtitle").textContent = String(err);
});
</script>
</body>
</html>
